# en-US English messages
#
# Keys mirror the error codes in internal/apperr, so error responses are
# localized automatically based on the request language.
# Values are fmt templates; %s maps to APIError.Extra in order.
# Keep the key set identical to zh-CN.yaml.

# --- Common ---
common.bad.request: "Invalid request parameters"
common.validate.error: "Parameter validation failed: %s"
common.not.found: "Resource not found"
common.conflict: "Resource already exists"
common.forbidden: "Access denied"
common.rate.limit: "Too many requests, please try again later"
common.internal.error: "Internal server error"
common.database.error: "Database operation failed"
common.route.not.found: "Endpoint not found"
common.method.not.allowed: "HTTP method not allowed"

# --- Auth & account ---
auth.token.missing: "Missing credentials, please provide a token in the %s header"
auth.token.malformed: "Malformed token, expected %s <token>"
auth.token.invalid: "Invalid token"
auth.token.expired: "Token has expired"
auth.token.revoked: "Token has been revoked, please sign in again"
auth.token.wrong.type: "Wrong token type"
auth.account.not.found: "Account does not exist or has been deactivated"
auth.account.disabled: "Account has been disabled"
auth.password.wrong: "Incorrect account or password"
auth.old.password.wrong: "Current password is incorrect"
auth.token.sign.failed: "Failed to sign token"

